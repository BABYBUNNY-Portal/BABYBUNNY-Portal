<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>特典配布</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <h1>ご来場ありがとうございました。</h1>
        <p class="message">
            特典のイラストをお届けします。<br>
            ぜひ保存してお楽しみください。<br>
        </p>
        <div class="message">

            <h2>利用について</h2>
                <p>- 画像の無断転載・再配布は禁止です。<br>
                - 画像の自作発言は禁止です。<br>
                - 商用利用は禁止です。<br>
                - 個人利用の範囲でお楽しみください。<br>
            <h2>画像の取り扱いについて</h2>
                - 画像の加工・改変は禁止です。<br>
                - 再配布はご遠慮ください。<br>
                - 配布画像の保存はご自身の端末で行ってください。</p>
        </div>
        <div class="message">
        <h2>BABY BUNNY 特典配布</h2>
        <img class="gift-image" src="images/1.png" alt="入場者特典のイラスト">
        <p class="note">画像を長押し、または右クリックして保存できます。</p></div>


        <div class="message"><h2>BABY BUNNY -3D- 特典配布</h2>
        <img class="gift-image" src="images/2.png" alt="入場者特典のイラスト">

        <p class="note">画像を長押し、または右クリックして保存できます。</p></div>
    </main>
</body>
</html>
